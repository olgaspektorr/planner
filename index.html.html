// ── STATE ────────────────────────────────────────────────
const SKEY = "olga_planner_v3";
let state = {};
try { state = JSON.parse(localStorage.getItem(SKEY) || "{}"); } catch(e){}
let currentTab = "2026";

function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(state)); }catch(e){} }

// ── HELPERS ──────────────────────────────────────────────
function pct(done,total){ return total ? Math.round(done/total*100) : 0; }

function ring(p, size, stroke){
  size = size||56; stroke = stroke||5;
  const r = (size - stroke*2)/2;
  const circ = 2*Math.PI*r;
  const off = circ - (p/100)*circ;
  const col = kpiColor(p);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}"
      stroke-width="${stroke}" stroke-dasharray="${circ}" stroke-dashoffset="${off}"
      stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"
      style="transition:stroke-dashoffset 0.4s,stroke 0.4s"/>
    <text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle"
      fill="${col}" font-size="${size*0.22}" font-weight="700" font-family="sans-serif">${p}%</text>
  </svg>`;
}

// ── WEEK STATS ───────────────────────────────────────────
function weekStats(w){
  const c = state[w.id]||{};
  const td = w.tasks.filter((_,i)=>c.tasks&&c.tasks[i]).length;
  const gd = w.goals.filter((_,i)=>c.goals&&c.goals[i]).length;
  return {td,gd,total:w.tasks.length+w.goals.length,done:td+gd};
}

function monthStats(month){
  const ws = WEEKS.filter(w=>w.month===month);
  const total = ws.reduce((s,w)=>s+w.tasks.length+w.goals.length,0);
  const done  = ws.reduce((s,w)=>s+weekStats(w).done,0);
  return {total,done,p:pct(done,total)};
}

function globalStats(){
  const total = WEEKS.reduce((s,w)=>s+w.tasks.length+w.goals.length,0);
  const done  = WEEKS.reduce((s,w)=>s+weekStats(w).done,0);
  return {total,done,p:pct(done,total)};
}

// ── RENDER 2026 ──────────────────────────────────────────
function render2026(){
  const g = globalStats();
  document.getElementById("globalKpiBlock").style.display="block";
  const kpiEl = document.getElementById("globalKpiNum");
  kpiEl.textContent = g.p+"%";
  kpiEl.style.color = kpiColor(g.p);

  const months = [...new Set(WEEKS.map(w=>w.month))];
  let html = `
    <div class="global-bar-wrap">
      <div class="global-bar-top">
        <span>Прогресс 2026 (${g.done}/${g.total} пунктов)</span>
        <span style="color:${kpiColor(g.p)};font-weight:700">${g.p}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${g.p}%"></div></div>
    </div>`;

  months.forEach(month=>{
    const mc = MONTH_COLORS[month];
    const ms = monthStats(month);
    const mDone = ms.p===100;
    const weeks = WEEKS.filter(w=>w.month===month);
    html += `<div class="month-block${mDone?" done":""}" id="mb_${month}">`;
    html += `<div class="month-header" style="background:linear-gradient(135deg,${mc.bg},${mc.soft});border-color:${mc.accent}44">
      ${ring(ms.p,64,6)}
      <div style="flex:1">
        <div class="month-name" style="color:${mc.accent}">${month} 2026${mDone?' <span style="font-size:16px">✓ Выполнен</span>':''}</div>
        <div class="month-sub">${ms.done} из ${ms.total} пунктов · ${weeks.length} недель</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:32px;font-weight:900;color:${kpiColor(ms.p)}">${ms.p}%</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.35)">КПИ месяца</div>
      </div>
    </div>`;

    weeks.forEach(w=>{
      const ws2 = weekStats(w);
      const wp = pct(ws2.done,ws2.total);
      const c = state[w.id]||{};
      html += `<div class="week-card" id="wc_${w.id}" style="background:${mc.soft};border-color:${mc.accent}33;box-shadow:0 2px 20px ${mc.accent}${mDone?"00":"22"}">
        <div class="week-header">
          ${ring(wp,52,5)}
          <div class="week-meta">
            <div class="week-label-row">
              <span class="week-label" style="color:${mc.accent}">${w.label}</span>
              <span class="week-dates">${w.dates}</span>
              <span class="week-month-badge">${w.month}</span>
            </div>
            <div class="week-focus">${w.focus}</div>
          </div>
        </div>
        <div class="section-label" style="color:${mc.accent}">🎯 3 Цели недели</div>`;
      w.goals.forEach((g2,i)=>{
        const done = !!(c.goals&&c.goals[i]);
        html += `<label class="check-item goal-item${done?" done":""}">
          <input type="checkbox" ${done?"checked":""} onchange="toggle('${w.id}','goals',${i})">
          <span>${g2}</span></label>`;
      });
      html += `<div class="section-label" style="color:rgba(255,255,255,0.4);margin-top:10px">✅ Задачи (${ws2.td}/${w.tasks.length})</div>`;
      w.tasks.forEach((t,i)=>{
        const done = !!(c.tasks&&c.tasks[i]);
        html += `<label class="check-item task-item${done?" done":""}">
          <input type="checkbox" ${done?"checked":""} onchange="toggle('${w.id}','tasks',${i})">
          <span>${t}</span></label>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  });

  document.getElementById("mainContent").innerHTML = html;
}

// ── RENDER YEARS ─────────────────────────────────────────
function renderYear(yr){
  document.getElementById("globalKpiBlock").style.display="none";
  const data = YEARS.find(y=>y.year===yr);
  if(!data) return;
  let html = `<div class="year-card" style="border-color:${data.color}44">
    <div class="year-header" style="background:linear-gradient(135deg,#111827,${data.color}15)" onclick="toggleYear(${data.year})">
      <div>
        <div class="year-sub" style="color:${data.color}">${data.year}</div>
        <div class="year-title">${data.title}</div>
      </div>
      <div class="year-arrow" id="ya_${data.year}" style="color:${data.color}">▼</div>
    </div>
    <div class="year-body" id="yb_${data.year}">
      <div class="section-label" style="color:${data.color};padding-top:4px">🎯 3 Главные цели</div>`;
  data.goals.forEach(g=>{
    html += `<div class="goal-card" style="background:${data.color}12;border:1px solid ${data.color}33;margin-top:10px">
      <div class="goal-card-title">${g.g}</div>
      <div class="goal-card-detail">${g.d}</div>
      <div class="goal-card-metric" style="color:${data.color}">📊 ${g.m}</div>
    </div>`;
  });
  html += `<div class="section-divider"></div>
    <div class="section-label" style="color:${data.color}">📆 По кварталам</div>
    <div class="quarters-grid" style="margin-top:10px">`;
  data.quarters.forEach(q=>{
    html += `<div class="quarter-box">
      <div class="quarter-title" style="color:${data.color}">${q.q}</div>`;
    q.items.forEach(item=>{
      html += `<div class="quarter-item" style="border-left-color:${data.color}55">${item}</div>`;
    });
    html += `</div>`;
  });
  html += `</div></div></div>`;
  document.getElementById("mainContent").innerHTML = html;
}

// ── TABS ─────────────────────────────────────────────────
function buildTabs(){
  const tabs = document.getElementById("tabs");
  ["2026","2027","2028","2029","2030"].forEach(t=>{
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (t===currentTab?" active":"");
    btn.textContent = t;
    btn.onclick = ()=>{ currentTab=t; buildTabs(); if(t==="2026") render2026(); else renderYear(parseInt(t)); };
    tabs.appendChild(btn);
  });
}

// ── TOGGLE ───────────────────────────────────────────────
function toggle(wid, type, idx){
  if(!state[wid]) state[wid]={};
  if(!state[wid][type]) state[wid][type]={};
  state[wid][type][idx] = !state[wid][type][idx];
  save();
  render2026();
}

function toggleYear(yr){
  const body = document.getElementById("yb_"+yr);
  const arr  = document.getElementById("ya_"+yr);
  const open = body.classList.toggle("open");
  arr.textContent = open ? "▲" : "▼";
}

// ── INIT ─────────────────────────────────────────────────
buildTabs();
render2026();
